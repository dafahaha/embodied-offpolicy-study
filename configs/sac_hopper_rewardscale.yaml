# SAC on Hopper-v4 with reward scaling 0.1 (scales rewards entering the critic).
# Identical to baseline except reward_scale.
env_id: Hopper-v4
total_steps: 60000
start_steps: 1000
replay_size: 1000000
batch_size: 256
hidden_sizes: [256, 256]
gamma: 0.99
tau: 0.005
lr: 0.0003
alpha: 0.2
automatic_entropy_tuning: true
reward_scale: 0.1
eval_every: 5000
eval_episodes: 5
