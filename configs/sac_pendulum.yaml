# Quick end-to-end validation on Pendulum (not part of the Hopper study).
env_id: Pendulum-v1
total_steps: 6000
start_steps: 500
replay_size: 50000
batch_size: 256
hidden_sizes: [128, 128]
gamma: 0.99
tau: 0.005
lr: 0.001
alpha: 0.2
automatic_entropy_tuning: true
reward_scale: 1.0
eval_every: 1000
eval_episodes: 3
