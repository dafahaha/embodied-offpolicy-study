name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-learn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.12+ required: pinned numpy 2.5.2 / scipy 1.18.1 have no cp311 wheels
        python-version: "3.12"
      - name: System deps for headless MuJoCo
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install python deps
        run: pip install -r requirements.txt
      - name: Lint (byte-compile)
        run: python -m compileall src train.py plot.py ci_check.py
      - name: Unit tests
        run: pytest tests/ -q
      - name: Learn gate (Pendulum, fast)
        run: python ci_check.py
