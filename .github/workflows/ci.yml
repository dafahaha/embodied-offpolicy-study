name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-learn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.12+ required: pinned numpy 2.5.2 / scipy 1.18.1 have no cp311 wheels
          python-version: "3.12"
      - name: System deps for headless MuJoCo
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install python deps
        run: pip install -r requirements.txt
      - name: Lint gates (black / isort / flake8)
        run: |
          pip install black isort flake8
          black --check --line-length=100 src train.py plot.py ci_check.py check_study_artifacts.py conftest.py tests docs/assets/recompute_stats.py
          isort --check-only --line-length=100 --profile black src train.py plot.py ci_check.py check_study_artifacts.py conftest.py tests docs/assets/recompute_stats.py
          flake8 --max-line-length=100 --extend-ignore=E203,W503 src train.py plot.py ci_check.py check_study_artifacts.py conftest.py tests docs/assets/recompute_stats.py
      - name: Lint (byte-compile)
        run: python -m compileall src train.py plot.py ci_check.py check_study_artifacts.py docs/assets/recompute_stats.py
      - name: Unit tests
        run: pytest tests/ -q
      - name: Independent stats recompute (results.json must match committed)
        run: |
          python docs/assets/recompute_stats.py
          git diff --exit-code -- docs/assets/results.json
      - name: Artifact freshness gate (figures + committed stats)
        run: |
          python plot.py
          python check_study_artifacts.py
      - name: Learn gate (Pendulum, fast)
        run: python ci_check.py
